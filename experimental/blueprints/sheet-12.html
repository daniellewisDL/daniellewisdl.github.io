<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet 12 · Atlas · Topology</title>
<style>
  :root{
    --c:#8fe3ff; --c2:rgba(143,227,255,.6); --dim:rgba(143,227,255,.3); --hi:#e8f7ff;
    --gold:#ffc46b; --bg:#01060f; --vig:rgba(0,0,6,.9); --tglow:0 0 12px rgba(143,227,255,.8);
  }
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;
    font-family:"JetBrains Mono","SFMono-Regular",Consolas,ui-monospace,monospace;color:var(--c);
    -webkit-font-smoothing:antialiased;user-select:none}
  #gl{position:fixed;inset:0;display:block;width:100%;height:100%;cursor:crosshair}
  #ann{position:fixed;inset:0;pointer-events:none}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,transparent 50%,color-mix(in srgb,var(--vig) 60%,transparent) 80%,var(--vig) 100%)}
  .scan{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,color-mix(in srgb,var(--c) 3%,transparent) 0 1px,transparent 1px 3px)}
  body.light .scan{opacity:.35;background:
    repeating-linear-gradient(90deg,rgba(60,40,10,.025) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(0deg,rgba(60,40,10,.02) 0 1px,transparent 1px 5px)}
  .frame{position:fixed;inset:14px;pointer-events:none;border:1px solid color-mix(in srgb,var(--c) 14%,transparent)}
  .frame i{position:absolute;width:22px;height:22px;border:0 solid var(--c)}
  .frame i:nth-child(1){left:-1px;top:-1px;border-left-width:2px;border-top-width:2px}
  .frame i:nth-child(2){right:-1px;top:-1px;border-right-width:2px;border-top-width:2px}
  .frame i:nth-child(3){left:-1px;bottom:-1px;border-left-width:2px;border-bottom-width:2px}
  .frame i:nth-child(4){right:-1px;bottom:-1px;border-right-width:2px;border-bottom-width:2px}
  .panel{position:fixed;pointer-events:none;font-size:10.5px;line-height:1.55;letter-spacing:.06em}
  #tl{left:34px;top:30px}
  #tl h1{margin:0 0 2px;font-size:15px;letter-spacing:.32em;font-weight:600;color:var(--hi);text-shadow:var(--tglow)}
  #tl .sub{color:var(--c2);margin-bottom:10px}
  #tl table{border-collapse:collapse}
  #tl td{padding:0 14px 0 0;color:var(--c2)} #tl td+td{color:var(--hi);font-variant-numeric:tabular-nums}
  #tr{right:34px;top:30px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums;white-space:pre}
  #tr b{color:var(--gold);font-weight:500}
  #bl{left:34px;bottom:30px;color:var(--c2)}
  #bl kbd{border:1px solid var(--dim);padding:0 4px;border-radius:2px;color:var(--hi);font-family:inherit}
  #br{right:34px;bottom:30px;text-align:right;color:var(--c2)}
  .scale{display:inline-block;width:120px;height:6px;border:1px solid var(--c);border-top:0;margin-left:8px;vertical-align:middle;
    background:linear-gradient(90deg,var(--c) 0 25%,transparent 25% 50%,var(--c) 50% 75%,transparent 75%) bottom/100% 2px no-repeat}
  .stamp{display:inline-block;margin-top:6px;border:1px solid var(--gold);color:var(--gold);padding:2px 8px;letter-spacing:.25em;
    transform:rotate(-2deg);opacity:.85}
  #nav{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:3px;z-index:5}
  #nav a{display:block;width:24px;height:18px;line-height:18px;text-align:center;font-size:9.5px;color:var(--c2);
    border:1px solid var(--dim);text-decoration:none;background:color-mix(in srgb,var(--bg) 70%,transparent)}
  #nav a:hover{color:var(--hi);border-color:var(--c)}
  #nav a.on{color:var(--bg);background:var(--c);border-color:var(--c);font-weight:700}
  @media (max-width:900px){ #bl{display:none} }
  @media (max-width:640px){ #tr{display:none} #tl h1{font-size:12px} .panel{font-size:9px} #nav{bottom:auto;top:20px;left:auto;right:20px;transform:none;flex-wrap:wrap;width:170px} #nav a{width:22px} }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ann"></canvas>
<div class="scan"></div>
<div class="vignette"></div>
<div class="frame"><i></i><i></i><i></i><i></i></div>
<div class="panel" id="tl"><h1 id="hTitle"></h1><div class="sub" id="hSub"></div><table id="hRows"></table></div>
<div class="panel" id="tr"></div>
<div class="panel" id="bl"></div>
<div class="panel" id="br"><div>CAM <span id="sCam">—</span></div><div id="hScale"></div><div class="stamp" id="hStamp"></div></div>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
window.HUD = (() => {
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, '0');
  const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; };
  const DEFAULT_HINT = '<kbd>DRAG</kbd> orbit &nbsp; <kbd>WHEEL</kbd> zoom &nbsp; <kbd>CLICK</kbd> shockwave &nbsp; <kbd>SPACE</kbd> pause &nbsp; <kbd>← →</kbd> sheets';
  let D, fEl, tEl, frames = 0, acc = 0, T = 0, rs = 7919;
  const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
  const hex = () => Math.floor(rnd() * 0xffffff).toString(16).toUpperCase().padStart(6, '0');

  function init(cfg) {
    D = cfg; rs = 7919 + cfg.num * 131;
    const s = document.documentElement.style;
    s.setProperty('--bg', D.bg); s.setProperty('--c', D.ink); s.setProperty('--c2', rgba(D.ink, .62));
    s.setProperty('--dim', rgba(D.ink, .3)); s.setProperty('--hi', D.hi); s.setProperty('--gold', D.accent);
    s.setProperty('--vig', D.vig); s.setProperty('--tglow', D.light ? 'none' : `0 0 12px ${rgba(D.ink, .8)}`);
    document.body.classList.toggle('light', !!D.light);
    $('hTitle').textContent = D.title;
    $('hSub').textContent = `${D.sub} · SHEET ${pad(D.num)} OF 12 · REV ${D.rev}`;
    $('bl').innerHTML = D.hint || DEFAULT_HINT;
    $('hScale').innerHTML = `SCALE ${D.scale} <span class="scale"></span>`;
    $('hStamp').textContent = D.stamp;
    const nav = $('nav');
    for (let i = 1; i <= 12; i++) {
      const a = document.createElement('a'); a.href = `sheet-${pad(i)}.html`; a.textContent = pad(i);
      a.title = `Sheet ${pad(i)}`; if (i === D.num) a.className = 'on'; nav.appendChild(a);
    }
    addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') location.href = `sheet-${pad(D.num % 12 + 1)}.html`;
      if (e.key === 'ArrowLeft') location.href = `sheet-${pad((D.num + 10) % 12 + 1)}.html`;
    });
    const tr = $('tr'); const lines = Array.from({ length: 14 }, () => `${hex()} ${hex()} ${hex()}`);
    setInterval(() => {
      lines.shift();
      lines.push(rnd() < .15 ? `<b>SYNC ${hex()}</b> ◆ OK` : `${hex()} ${hex()} ${hex()}`);
      tr.innerHTML = (D.tele || 'TELEMETRY') + '\n' + lines.join('\n');
    }, 140);
  }

  function rows(list) {
    const el = $('hRows');
    el.innerHTML = list.concat([['FRAME', '—'], ['EPOCH', '—']])
      .map(([k, v]) => `<tr><td>${k}</td><td>${typeof v === 'number' ? v.toLocaleString() : v}</td></tr>`).join('');
    const tds = el.querySelectorAll('td+td'); fEl = tds[tds.length - 2]; tEl = tds[tds.length - 1];
  }

  function tick(dt, cam) {
    T += dt; frames++; acc += dt;
    if (acc > .5) { if (fEl) fEl.textContent = (frames / acc).toFixed(0) + ' fps'; frames = 0; acc = 0; }
    if (tEl) tEl.textContent = 'T+' + T.toFixed(2);
    if (cam) $('sCam').textContent = `${cam.x.toFixed(0)} ${cam.y.toFixed(0)} ${cam.z.toFixed(0)}`;
  }

  /* rulers, reticle and leader-line callouts. items: [{x,y,id,lines:[..]}] in CSS px */
  function overlay(ctx, W, H, t, dpr, items) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.font = '10px "JetBrains Mono",Consolas,ui-monospace,monospace';
    ctx.lineWidth = 1;
    ctx.strokeStyle = rgba(D.ink, .35);
    ctx.beginPath();
    for (let x = 30; x < W - 30; x += 10) { const L = x % 100 === 0 ? 8 : x % 50 === 0 ? 5 : 3; ctx.moveTo(x + .5, H - 14); ctx.lineTo(x + .5, H - 14 - L); }
    for (let y = 30; y < H - 30; y += 10) { const L = y % 100 === 0 ? 8 : y % 50 === 0 ? 5 : 3; ctx.moveTo(14, y + .5); ctx.lineTo(14 + L, y + .5); }
    ctx.stroke();
    const cx = W / 2, cy = H / 2, rot = t * .2;
    ctx.strokeStyle = rgba(D.ink, .22);
    ctx.beginPath(); ctx.arc(cx, cy, 36, rot, rot + 1.2); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx, cy, 36, rot + Math.PI, rot + Math.PI + 1.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 8, cy); ctx.lineTo(cx - 3, cy); ctx.moveTo(cx + 3, cy); ctx.lineTo(cx + 8, cy);
    ctx.moveTo(cx, cy - 8); ctx.lineTo(cx, cy - 3); ctx.moveTo(cx, cy + 3); ctx.lineTo(cx, cy + 8); ctx.stroke();
    items.forEach((a, i) => {
      const { x, y } = a;
      const side = x > W / 2 ? 1 : -1, ex = x + side * 34, ey = y - 30, hx = ex + side * 96;
      const pulse = .5 + .5 * Math.sin(t * 3 + i);
      ctx.strokeStyle = rgba(D.ink, .45 + .35 * pulse);
      ctx.beginPath(); ctx.arc(x, y, 5 + pulse * 2, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.lineTo(x - 7, y); ctx.moveTo(x + 7, y); ctx.lineTo(x + 10, y);
      ctx.moveTo(x, y - 10); ctx.lineTo(x, y - 7); ctx.moveTo(x, y + 7); ctx.lineTo(x, y + 10); ctx.stroke();
      ctx.strokeStyle = rgba(D.ink, .6);
      ctx.beginPath(); ctx.moveTo(x + side * 7, y - 6); ctx.lineTo(ex, ey); ctx.lineTo(hx, ey); ctx.stroke();
      ctx.textAlign = side > 0 ? 'left' : 'right';
      ctx.fillStyle = D.hi; ctx.fillText(a.id, ex + side * 2, ey - 5);
      const lines = (a.lines || []).concat([`Φ ${(Math.sin(t * .7 + i) * 50 + 50).toFixed(2)}%`]);
      lines.forEach((l, k) => {
        ctx.fillStyle = k === lines.length - 1 ? rgba(D.accent, .85) : rgba(D.ink, .7);
        ctx.fillText(l, ex + side * 2, ey + 12 + k * 12);
      });
    });
  }
  return { init, rows, tick, overlay, rgba };
})();
</script>
<script>
(() => {
const D = {
  num: 12, title: 'ATLAS // TOPOLOGY', sub: 'FORCE-DIRECTED COMMUNITY MAP · d3', rev: 'M', stamp: 'FINAL',
  scale: '1 : k-core', tele: 'MODULARITY ▸ Q', bg: '#0a0c10', ink: '#a8bdd6', hi: '#ffffff', accent: '#ff7a3d',
  vig: 'rgba(0,0,0,.85)', light: false,
  hint: '<kbd>DRAG</kbd> pan &nbsp; <kbd>WHEEL</kbd> zoom &nbsp; <kbd>CLICK</kbd> blast (moves nodes) &nbsp; <kbd>SPACE</kbd> freeze &nbsp; <kbd>← →</kbd> sheets',
};
HUD.init(D);

let seed = 4242;
const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rnd();
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(6.2831853 * v); };
const PAL = ['#a8bdd6', '#a8bdd6', '#6effc7', '#ff7a3d', '#e8f0ff', '#7aa8ff'];

/* ---------- graph: 26 preferential-attachment communities + sparse bridges ---------- */
const K = 26, nodes = [], links = [], centers = [];
for (let c = 0; c < K; c++) {
  const r = 120 * Math.sqrt(c + .5), th = c * 2.39996323;
  centers.push({ x: Math.cos(th) * r, y: Math.sin(th) * r, color: PAL[Math.floor(rnd() * PAL.length)], members: [] });
}
centers.forEach((cc, c) => {
  const n = Math.floor(30 + Math.pow(rnd(), 2.2) * 230), start = nodes.length, deg = [];
  for (let i = 0; i < n; i++) {
    const id = nodes.length;
    nodes.push({ id, c, deg: 0, x: gauss() * 4, y: gauss() * 4, ph: rnd() * 6.283, sp: rr(1, 3.5) });
    cc.members.push(nodes[id]);
    if (i === 0) continue;
    const m = i < 3 ? 1 : (rnd() < .35 ? 2 : 1);
    for (let k = 0; k < m; k++) {
      const tot = deg.reduce((s, d) => s + d + 1, 0); let r = rnd() * tot, j = 0;
      for (; j < deg.length; j++) if ((r -= deg[j] + 1) <= 0) break;
      const tgt = start + Math.min(j, i - 1);
      links.push({ source: id, target: tgt, cross: false }); nodes[id].deg++; nodes[tgt].deg++;
      deg[j] = (deg[j] || 0) + 1;
    }
    deg[i] = m;
  }
});
const hubs = centers.map(cc => cc.members.reduce((a, b) => b.deg > a.deg ? b : a));
hubs.forEach((h, c) => [1, 2].forEach(k => { const o = hubs[(c + k) % K]; links.push({ source: h.id, target: o.id, cross: true }); h.deg++; o.deg++; }));
for (let k = 0; k < 170; k++) {
  const a = nodes[Math.floor(rnd() * nodes.length)], b = nodes[Math.floor(rnd() * nodes.length)];
  if (a.c !== b.c) { links.push({ source: a.id, target: b.id, cross: true }); a.deg++; b.deg++; }
}
nodes.forEach(n => n.r = 1.1 + Math.sqrt(n.deg) * .9);

/* modularity of the community partition */
const m2 = links.length * 2, Lc = new Array(K).fill(0), Dc = new Array(K).fill(0);
links.forEach(l => { const a = nodes[l.source], b = nodes[l.target]; if (a.c === b.c) Lc[a.c]++; });
nodes.forEach(n => Dc[n.c] += n.deg);
const Q = Lc.reduce((s, l, c) => s + l / (m2 / 2) - Math.pow(Dc[c] / m2, 2), 0);

const sim = d3.forceSimulation(nodes)
  .force('link', d3.forceLink(links).id(d => d.id).distance(l => l.cross ? 140 : 6 + rnd() * 7).strength(l => l.cross ? .015 : .8))
  .force('charge', d3.forceManyBody().strength(-18).distanceMax(140).theta(1.1))
  .force('x', d3.forceX(d => centers[d.c].x).strength(.03))
  .force('y', d3.forceY(d => centers[d.c].y).strength(.03))
  .alphaDecay(.008).velocityDecay(.32).stop();

/* ---------- canvas & sprites ---------- */
const cv = document.getElementById('gl'), g = cv.getContext('2d');
const ann = document.getElementById('ann'), actx = ann.getContext('2d');
const DPR = Math.min(devicePixelRatio, 2);
let W = 0, H = 0, sel = null, zoom = null, tr = d3.zoomIdentity;
function resize() {
  const oW = W, oH = H;
  W = innerWidth; H = innerHeight;
  if (sel) sel.call(zoom.transform, tr.translate((W - oW) / 2 / tr.k, (H - oH) / 2 / tr.k));
  for (const c of [cv, ann]) { c.width = W * DPR; c.height = H * DPR; c.style.width = W + 'px'; c.style.height = H + 'px'; }
}
addEventListener('resize', resize); resize();
const sprite = (hex, flare) => {
  const s = document.createElement('canvas'); s.width = s.height = 64; const x = s.getContext('2d');
  const grd = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, '#ffffff'); grd.addColorStop(.12, hex); grd.addColorStop(.35, HUD.rgba(hex, .25)); grd.addColorStop(1, HUD.rgba(hex, 0));
  x.fillStyle = grd; x.fillRect(0, 0, 64, 64);
  if (flare) {
    x.globalCompositeOperation = 'lighter';
    for (const [w, h] of [[64, 3], [3, 64]]) {
      const lg = x.createLinearGradient(w > h ? 0 : 32, w > h ? 32 : 0, w > h ? 64 : 32, w > h ? 32 : 64);
      lg.addColorStop(0, HUD.rgba(hex, 0)); lg.addColorStop(.5, '#ffffff'); lg.addColorStop(1, HUD.rgba(hex, 0));
      x.fillStyle = lg; x.fillRect(32 - w / 2, 32 - h / 2, w, h);
    }
  }
  return s;
};
const SPR = {}, FLR = {};
PAL.concat(['#ffffff']).forEach(h => { SPR[h] = sprite(h); FLR[h] = sprite(h, true); });

/* packets */
const intra = links.filter(l => !l.cross);
const packets = Array.from({ length: 1600 }, () => ({ l: links[Math.floor(rnd() * links.length)], f: rnd(), s: rr(.4, 1.4) }));

/* zoom + fly-in */
zoom = d3.zoom().scaleExtent([.12, 10]).on('zoom', e => tr = e.transform);
sel = d3.select(cv).call(zoom).on('dblclick.zoom', null);
sel.call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(.12));
sel.transition().duration(5000).ease(d3.easeCubicOut).call(zoom.transform, d3.zoomIdentity.translate(W / 2, H / 2).scale(Math.min(W, H) / 1500));

let shocks = [], paused = false;
cv.addEventListener('click', e => {
  const [x, y] = tr.invert([e.offsetX, e.offsetY]); shocks.push({ x, y, t0: T });
  sim.alpha(Math.max(sim.alpha(), .35));
});
addEventListener('keydown', e => { if (e.code === 'Space') { paused = !paused; e.preventDefault(); } });

const hubAnn = hubs.slice().sort((a, b) => b.deg - a.deg).slice(0, 6);
HUD.rows([['NODES', nodes.length], ['EDGES', links.length], ['COMMUNITIES', K], ['PACKETS', packets.length], ['MODULARITY Q', Q.toFixed(3)]]);

/* ---------- render ---------- */
let T = 0, last = performance.now(), fcount = 0;
function draw(dt) {
  T += dt;
  if (!paused) {
    if (T > 12) sim.alphaTarget(.012);
    if (sim.alpha() > .04 || shocks.length || fcount++ % 3 === 0) sim.tick();
    shocks.forEach(s => {
      const R = (T - s.t0) * 420;
      nodes.forEach(n => { const dx = n.x - s.x, dy = n.y - s.y, d = Math.hypot(dx, dy) || 1;
        if (Math.abs(d - R) < 26) { const k = 2.2 * Math.exp(-(T - s.t0) * .8); n.vx += dx / d * k; n.vy += dy / d * k; n.hit = T; } });
    });
    shocks = shocks.filter(s => T - s.t0 < 4);
    packets.forEach(p => { p.f += dt * p.s * (p.l.cross ? .25 : 1.6); if (p.f > 1) { p.f = 0; p.l = rnd() < .8 ? intra[Math.floor(rnd() * intra.length)] : links[Math.floor(rnd() * links.length)]; } });
  }
  const k = tr.k;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over';
  g.fillStyle = D.bg; g.fillRect(0, 0, cv.width, cv.height);
  g.setTransform(DPR * k, 0, 0, DPR * k, DPR * tr.x, DPR * tr.y);
  const [x0, y0] = tr.invert([0, 0]), [x1, y1] = tr.invert([W, H]);

  // blueprint grid in world space
  [[20, .035], [100, .08], [500, .16]].forEach(([s, a]) => {
    if (s * k < 6) return;
    g.strokeStyle = HUD.rgba(D.ink, a); g.lineWidth = 1 / k; g.beginPath();
    for (let x = Math.floor(x0 / s) * s; x <= x1; x += s) { g.moveTo(x, y0); g.lineTo(x, y1); }
    for (let y = Math.floor(y0 / s) * s; y <= y1; y += s) { g.moveTo(x0, y); g.lineTo(x1, y); }
    g.stroke();
  });
  g.strokeStyle = HUD.rgba(D.ink, .12);
  for (let r = 200; r <= 1000; r += 200) { g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.stroke(); }
  g.beginPath();
  for (let a = 0; a < 360; a += 5) { const L = a % 30 ? 8 : 22, c = Math.cos(a * Math.PI / 180), s = Math.sin(a * Math.PI / 180); g.moveTo(c * 1000, s * 1000); g.lineTo(c * (1000 + L), s * (1000 + L)); }
  g.stroke();

  // voronoi of community centroids
  const cents = centers.map(cc => { let x = 0, y = 0; cc.members.forEach(n => { x += n.x; y += n.y; }); return [x / cc.members.length, y / cc.members.length]; });
  const vor = d3.Delaunay.from(cents).voronoi([-1400, -1400, 1400, 1400]);
  g.setLineDash([4 / k, 6 / k]); g.strokeStyle = HUD.rgba(D.ink, .16); g.beginPath(); vor.render(g); g.stroke();

  // hulls + labels
  g.setLineDash([2 / k, 3 / k]);
  centers.forEach((cc, c) => {
    const hull = d3.polygonHull(cc.members.map(n => [n.x, n.y])); if (!hull) return;
    g.strokeStyle = HUD.rgba(cc.color, .38); g.beginPath();
    const [cx, cy] = cents[c];
    hull.forEach(([x, y], i) => { const dx = x - cx, dy = y - cy, d = Math.hypot(dx, dy) || 1, px = x + dx / d * 8, py = y + dy / d * 8; i ? g.lineTo(px, py) : g.moveTo(px, py); });
    g.closePath(); g.stroke();
    if (k > .35) { g.fillStyle = HUD.rgba(cc.color, .75); g.font = `${10 / k}px Consolas, monospace`; g.fillText(`C-${String(c).padStart(2, '0')} · n=${cc.members.length}`, cx + 6 / k, cy - Math.max(...hull.map(p => Math.hypot(p[0] - cx, p[1] - cy))) - 12 / k); }
  });
  g.setLineDash([]);

  // edges
  g.globalCompositeOperation = 'lighter';
  const byCol = {};
  intra.forEach(l => (byCol[centers[l.source.c].color] ||= []).push(l));
  g.lineWidth = .8 / k;
  for (const h in byCol) { g.strokeStyle = HUD.rgba(h, .3); g.beginPath(); byCol[h].forEach(l => { g.moveTo(l.source.x, l.source.y); g.lineTo(l.target.x, l.target.y); }); g.stroke(); }
  g.strokeStyle = HUD.rgba(D.accent, .28); g.lineWidth = 1 / k; g.beginPath();
  links.forEach(l => { if (!l.cross) return; const a = l.source, b = l.target, mx = (a.x + b.x) / 2 - (b.y - a.y) * .18, my = (a.y + b.y) / 2 + (b.x - a.x) * .18; g.moveTo(a.x, a.y); g.quadraticCurveTo(mx, my, b.x, b.y); });
  g.stroke();

  // packets
  packets.forEach(p => {
    const a = p.l.source, b = p.l.target; let x, y;
    if (p.l.cross) { const mx = (a.x + b.x) / 2 - (b.y - a.y) * .18, my = (a.y + b.y) / 2 + (b.x - a.x) * .18, u = 1 - p.f; x = u * u * a.x + 2 * u * p.f * mx + p.f * p.f * b.x; y = u * u * a.y + 2 * u * p.f * my + p.f * p.f * b.y; }
    else { x = a.x + (b.x - a.x) * p.f; y = a.y + (b.y - a.y) * p.f; }
    const s = (p.l.cross ? 7 : 4.5) / Math.sqrt(k);
    g.drawImage(SPR[p.l.cross ? '#ff7a3d' : '#ffffff'], x - s, y - s, s * 2, s * 2);
  });

  // nodes + sparkle
  nodes.forEach(n => {
    const col = centers[n.c].color, hit = n.hit && T - n.hit < 1.2 ? 1 - (T - n.hit) / 1.2 : 0;
    const s = n.r * 2.6 * (1 + hit * 1.5);
    g.drawImage(SPR[hit > .3 ? '#ffffff' : col], n.x - s, n.y - s, s * 2, s * 2);
    const sp = Math.pow(Math.max(Math.sin(T * n.sp + n.ph), 0), 40);
    if (sp > .05) { const f = s * (2 + sp * 4); g.globalAlpha = sp; g.drawImage(FLR[col], n.x - f, n.y - f, f * 2, f * 2); g.globalAlpha = 1; }
  });
  hubs.forEach(h => { g.strokeStyle = HUD.rgba(D.hi, .6); g.lineWidth = 1 / k; g.beginPath(); g.arc(h.x, h.y, h.r + 5, 0, Math.PI * 2); g.stroke(); });

  // shock rings
  g.globalCompositeOperation = 'lighter';
  shocks.forEach(s => { const R = (T - s.t0) * 420, a = Math.exp(-(T - s.t0) * .8); g.strokeStyle = HUD.rgba(D.accent, .7 * a); g.lineWidth = 2 / k; g.beginPath(); g.arc(s.x, s.y, R, 0, Math.PI * 2); g.stroke(); });

  // overlay callouts
  const items = hubAnn.map(h => { const [x, y] = tr.apply([h.x, h.y]); return { x, y, id: `HUB C-${String(h.c).padStart(2, '0')}`, lines: [`degree ${h.deg}`, `(${h.x.toFixed(0)}, ${h.y.toFixed(0)})`] }; })
    .filter(i => i.x > 0 && i.x < W && i.y > 0 && i.y < H);
  HUD.overlay(actx, W, H, T, DPR, items);
  HUD.tick(dt, { x: tr.x - W / 2, y: tr.y - H / 2, z: k * 100 });
}
function frame(now) { const dt = Math.min((now - last) / 1000, .05); last = now; draw(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
window.__advance = (sec, fps = 30) => { for (let i = 0; i < sec * fps; i++) draw(1 / fps); };
})();

</script>
