<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assurance Quest</title>
<meta name="description" content="A side-scrolling adventure through the Global Internal Audit Standards: collect jewels, beat quiz bosses, earn your certificate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#f5efe2;--paper2:#efe6d3;--card:#fbf7ee;--ink:#1f1b16;--ink2:#4a4238;--ink3:#7a6f61;--rule:#d9cdb5;--gold:#b0862c;--gold2:#d8b25a;--gold3:#8a6516;
  --grad:linear-gradient(135deg,#8a6516 0%,#d8b25a 35%,#f3dc98 50%,#c49a3c 65%,#8a6516 100%);--d2:#8a3b52;--d3:#2f5d8a;--d4:#3e7a5c;--d5:#a4552f;--good:#3e7a5c;--bad:#a33a2f;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15120e;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#cv{display:block;box-shadow:0 0 90px rgba(0,0,0,.7)}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0 0 .35em}
.kicker{font:600 12px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gold3)}
.gold-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
kbd{font:600 10.5px var(--sans);border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:var(--paper);color:var(--ink3);margin-left:6px}
.btn{font:600 14px var(--sans);border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:11px 18px;border-radius:999px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary kbd{background:transparent;color:#cfc4ae;border-color:#5a5148}
.btn.gold{background:var(--grad);color:#2a1f0b;border-color:#b0862c}
.btn.small{padding:7px 12px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* overlays */
.ov{position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:14px;background:rgba(18,14,8,.5);backdrop-filter:blur(3px)}
.ov.on{display:grid;animation:fade .25s}
.ov.clear{background:transparent;backdrop-filter:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.45);padding:26px 30px;width:min(760px,100%);max-height:calc(100vh - 28px);overflow:auto;position:relative;animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.panel::before{content:"";position:absolute;inset:8px;border:1px solid rgba(176,134,44,.35);border-radius:14px;pointer-events:none}
@keyframes pop{from{transform:scale(.92) translateY(10px);opacity:0}to{transform:none;opacity:1}}
.panel p{font-size:16px;line-height:1.6;color:var(--ink2);margin:.4em 0 1em}
.card{display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:start}
.card .owl{width:120px;animation:bob 3s ease-in-out infinite}
.card .ref{display:inline-block;font:600 11px var(--sans);letter-spacing:.08em;color:var(--gold3);background:var(--paper2);border-radius:999px;padding:4px 10px;margin-bottom:14px}
.card .lesson-gem{display:inline-block;width:18px;height:18px;vertical-align:-3px;margin-right:6px}
@keyframes bob{50%{transform:translateY(-6px)}}
@media (max-width:640px){.card{grid-template-columns:1fr}.card .owl{width:80px}}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;padding:10px 14px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
#hud.hidden{display:none}
.pill{pointer-events:auto;display:inline-flex;align-items:center;gap:10px;background:rgba(251,247,238,.9);border:1px solid var(--rule);border-radius:999px;padding:7px 14px;font:600 13px var(--sans);box-shadow:0 4px 18px rgba(0,0,0,.18)}
.h-left{justify-self:start}.h-mid{justify-self:center}.h-right{justify-self:end}
.h-left .lvlname{font-family:var(--serif);font-size:18px;font-weight:600}
.pill b{font-variant-numeric:tabular-nums}
.ico{width:18px;height:18px;display:inline-block;vertical-align:-4px}
.hbtn{pointer-events:auto;border:0;background:transparent;cursor:pointer;font:600 12px var(--sans);color:var(--ink2);padding:2px 4px;border-radius:6px}
.hbtn:hover{color:var(--ink);background:var(--paper2)}
.hbtn.off{opacity:.4;text-decoration:line-through}
#hBar{grid-column:1/-1;justify-self:center;width:min(560px,70vw);height:8px;border-radius:99px;background:rgba(251,247,238,.55);position:relative;margin-top:2px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#hBarFill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--grad);width:0}
#hBarMarks i{position:absolute;top:-3px;width:10px;height:14px;margin-left:-5px;clip-path:polygon(50% 0,100% 40%,50% 100%,0 40%);background:#7a6f61}
#hBarMarks i.got{background:#d8b25a}
#hBarMarks i.boss{background:#a33a2f;clip-path:none;border-radius:3px;width:8px;margin-left:-4px}
@media (max-width:760px){#hud{grid-template-columns:1fr auto;}.h-mid{grid-column:1/-1;grid-row:2;justify-self:start}.h-left .lvlname{font-size:15px}}
/* toast */
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:12;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center}
#toast div{background:rgba(31,27,22,.88);color:#f5efe2;font:600 14px var(--sans);padding:9px 16px;border-radius:999px;animation:tin .3s, tout .4s 2.2s forwards}
@keyframes tin{from{transform:translateY(-8px);opacity:0}}
@keyframes tout{to{transform:translateY(-8px);opacity:0}}
/* touch */
#touch{position:fixed;inset:auto 0 0 0;z-index:11;display:none;justify-content:space-between;padding:0 18px 22px;pointer-events:none}
#touch.on{display:flex}
#touch button{pointer-events:auto;width:74px;height:74px;border-radius:50%;border:2px solid rgba(255,255,255,.5);background:rgba(31,27,22,.35);color:#fff;font:700 26px var(--sans);margin-right:12px;backdrop-filter:blur(4px);touch-action:none}
#touch button.act{background:rgba(176,134,44,.55)}
/* title */
.title-panel{text-align:center;width:min(820px,100%);padding:38px 34px}
.title-panel h1{font-size:clamp(44px,7vw,82px);font-weight:500;margin:.1em 0 .1em}
.title-panel .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink2)}
.title-panel .how{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font:13px var(--sans);color:var(--ink3);margin:18px 0 22px}
/* select */
.sel-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0 16px}
.hero-card{border:2px solid var(--rule);border-radius:16px;background:var(--paper);padding:10px;cursor:pointer;text-align:center;font:600 14px var(--sans);transition:border-color .15s,transform .15s}
.hero-card:hover{transform:translateY(-2px)}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,178,90,.35)}
.hero-card canvas{width:100%;max-width:220px;height:auto;display:block;margin:auto}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.swatches span{font:600 12px var(--sans);color:var(--ink3);min-width:62px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--rule);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--gold)}
.namein{font:600 16px var(--sans);padding:10px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);width:220px;color:var(--ink);user-select:text;-webkit-user-select:text}
/* map */
.map-panel{width:min(980px,100%)}
.map-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.map-svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node.locked{cursor:not-allowed}
.node circle.base{transition:r .15s}
.node:hover circle.base{r:34}
.node:focus{outline:none}
.node:focus-visible circle.base{stroke:#d8b25a;stroke-width:5}
/* codex */
.codex-lv{margin:14px 0}
.codex-lv h3{font-size:22px;margin-bottom:6px}
.codex-item{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--rule);font-size:14.5px;line-height:1.5}
.codex-item.locked{color:var(--ink3);font-style:italic}
/* mini-games */
.mini h2{font-size:30px}
.mini canvas{width:100%;height:auto;border-radius:12px;display:block;background:#10202c;touch-action:none}
.choice{display:block;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);color:var(--ink);padding:13px 16px;border-radius:12px;cursor:pointer;font:500 15px var(--sans);margin:8px 0;transition:border-color .15s,background .15s}
.choice:hover{border-color:var(--gold)}
.choice.right{border-color:var(--good);background:#e7f0e7}
.choice.wrong{border-color:var(--bad);background:#f6e4e1}
.choice:disabled{cursor:default}
.scen{font-family:var(--serif);font-size:22px;line-height:1.35;margin:10px 0 6px}
.fb{background:var(--paper2);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-top:10px}
.prog{font:600 12px var(--sans);color:var(--ink3);letter-spacing:.1em;text-transform:uppercase}
.scrolls{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:14px 0}
.scroll{border:1px solid var(--rule);background:linear-gradient(#fbf3de,#f1e4c6);border-radius:10px;padding:14px 12px;cursor:pointer;font:500 14px var(--sans);min-height:74px;display:flex;align-items:center;position:relative;transition:transform .15s}
.scroll:hover{transform:rotate(-1deg) translateY(-2px)}
.scroll.on{outline:3px solid var(--gold);background:linear-gradient(#fff6dc,#f6e2a8)}
.scroll.right{outline:3px solid var(--good)}
.scroll.wrong{outline:3px solid var(--bad)}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:12px 0}
.unit{border:1px solid var(--rule);border-radius:12px;padding:12px;background:var(--paper);cursor:pointer;font:500 14px var(--sans);position:relative}
.unit.on{background:#e7f0e7;border-color:var(--good)}
.unit .rk{font:700 11px var(--sans);letter-spacing:.08em;padding:2px 8px;border-radius:99px;display:inline-block;margin-top:6px}
.rk.H{background:#f3d9d4;color:#a33a2f}.rk.M{background:#f6e8c8;color:#8a6516}.rk.L{background:#dcebdc;color:#3e7a5c}
.budget{height:14px;border-radius:99px;background:var(--paper2);overflow:hidden;border:1px solid var(--rule)}
.budget i{display:block;height:100%;background:var(--grad);transition:width .3s}
.cc{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cc>div{border-radius:12px;padding:14px;font-size:15px;line-height:1.45}
.cc .cr{background:#e3efe6;border:1px solid #9cc0a7}.cc .cd{background:#f6e7dc;border:1px solid #d9ae8e}
.cc b{display:block;font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.mcard{perspective:700px;height:108px;cursor:pointer}
.mcard .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.up .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px;font:600 13px var(--sans)}
.mcard .f{background:var(--grad);color:#2a1f0b;font:700 26px var(--serif)}
.mcard .b{background:var(--paper);border:1px solid var(--rule);transform:rotateY(180deg);line-height:1.3}
.mcard.done .b{background:#e7f0e7;border-color:var(--good)}
@media (max-width:600px){.mem{grid-template-columns:repeat(3,1fr)}.mcard{height:96px}.cc{grid-template-columns:1fr}}
/* boss */
.boss-panel{width:min(860px,100%);display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center}
.boss-svg{width:100%;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 16px 20px rgba(0,0,0,.25))}
.boss-svg.hit{animation:hit .55s}
.boss-svg.dead{animation:dead 1.1s forwards}
.boss-svg .eyes{animation:blink 4.5s infinite;transform-origin:120px 100px}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes hit{0%{transform:translateX(0)}20%{transform:translateX(-16px) rotate(-6deg);filter:brightness(2)}40%{transform:translateX(12px) rotate(5deg)}60%{transform:translateX(-8px)}100%{transform:none}}
@keyframes dead{to{transform:scale(.2) rotate(40deg) translateY(160px);opacity:0}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.hp{display:flex;gap:6px;margin:4px 0 12px}
.hp i{width:26px;height:22px;background:#a33a2f;clip-path:path("M13 21 C 2 13 0 8 3 4 C 6 0 11 1 13 5 C 15 1 20 0 23 4 C 26 8 24 13 13 21 Z");transition:transform .3s,opacity .3s}
.hp i.gone{opacity:.18;transform:scale(.7)}
.taunt{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--d2);min-height:1.4em}
@media (max-width:720px){.boss-panel{grid-template-columns:1fr}.boss-svg{max-width:180px;margin:auto}}
/* complete */
.stars{display:flex;gap:10px;justify-content:center;margin:10px 0 6px}
.stars svg{width:62px;height:62px}
.stars svg.on{animation:starpop .5s both}
.stars svg:nth-child(2){animation-delay:.2s}.stars svg:nth-child(3){animation-delay:.4s}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25)}100%{transform:none}}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;text-align:center}
.stat b{display:block;font:600 28px var(--serif)}
.stat span{font:600 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--paper2);border-radius:999px;padding:8px 16px 8px 8px;font:600 14px var(--sans)}
.badge svg{width:34px;height:34px}
/* certificate */
.cert{width:min(900px,100%);text-align:center;padding:48px 40px;background:radial-gradient(circle at 50% 0,#fffaf0,#f6ecd6);border:10px double #b0862c}
.cert h1{font-size:clamp(34px,5vw,58px);font-weight:500}
.cert .who{font-family:var(--serif);font-size:clamp(36px,6vw,64px);font-style:italic;border-bottom:1px solid var(--gold);display:inline-block;padding:0 30px;margin:8px 0 14px}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:fixed;inset:0;margin:auto;box-shadow:none}.cert .row{display:none}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Game view"></canvas></div>

<div id="hud" class="hidden" aria-live="polite">
  <div class="h-left"><span class="pill"><span class="lvlname" id="hLevel">—</span></span></div>
  <div class="h-mid"><span class="pill">
    <span title="Lesson jewels"><svg class="ico" viewBox="0 0 20 20"><path d="M10 1 18 7 10 19 2 7Z" fill="#d8b25a" stroke="#8a6516"/></svg> <b id="hGems">0/0</b></span>
    <span title="Score"><svg class="ico" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="#e3be67" stroke="#8a6516"/><path d="M6 10l3 3 5-6" stroke="#8a6516" stroke-width="2" fill="none"/></svg> <b id="hScore">0</b></span>
    <span title="Setbacks">↺ <b id="hSet">0</b></span>
    <span id="hPower"></span>
  </span></div>
  <div class="h-right"><span class="pill">
    <button class="hbtn" id="bMusic" title="Music & sound (M)">♪ Sound</button>
    <button class="hbtn" id="bVoice" title="Mentor voice (V)">Voice</button>
    <button class="hbtn" id="bPause" title="Pause (Esc)">❚❚ Pause</button>
  </span></div>
  <div id="hBar"><i id="hBarFill"></i><div id="hBarMarks"></div></div>
</div>
<div id="toast" aria-live="polite"></div>
<div id="touch"><div><button data-k="left" aria-label="Left">◀</button><button data-k="right" aria-label="Right">▶</button></div><div><button data-k="jump" class="act" aria-label="Jump">⤒</button></div></div>
<div id="ov" class="ov" role="dialog" aria-modal="true"></div>
<canvas class="confetti" id="confetti"></canvas>

<script>
(() => {
'use strict';
/* =========================================================================
   Assurance Quest — a side-scrolling adventure through the
   Global Internal Audit Standards (IIA, 2024) and the UK Internal Audit
   Code of Practice (Chartered IIA, 2024). Single file, no dependencies.
   Lessons are paraphrased study aids, not the authoritative text.
   ========================================================================= */
const W = 1280, H = 720, TS = 48, ROWS = 15;
const GRAV = 2300, JUMP = 860, JUMP2 = 780, RUN = 330;
const $ = (s) => document.querySelector(s);
const cv = $('#cv'); let g = cv.getContext('2d');
let PX = 1;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  const dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr);
  PX = cv.width / W;
  const cf = $('#confetti'); cf.width = innerWidth; cf.height = innerHeight;
}
addEventListener('resize', resize); resize();

const rng = (seed) => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');

/* ============================== SAVE ============================== */
const SAVE_KEY = 'assuranceQuest.v1';
const blank = () => ({ hero: null, unlocked: 1, stats: {}, codex: [], muted: false, voice: true, best: 0 });
let save = (() => { try { return Object.assign(blank(), JSON.parse(localStorage.getItem(SAVE_KEY)) || {}); } catch (e) { return blank(); } })();
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ============================== AUDIO ============================== */
const AU = {
  ctx: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = save.muted ? 0 : .8; this.master.connect(c.destination);
    this.mus = c.createGain(); this.mus.gain.value = .3; this.mus.connect(this.master);
    this.fx = c.createGain(); this.fx.gain.value = .55; this.fx.connect(this.master);
    const b = c.createBuffer(1, c.sampleRate * .6, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = b;
    const dl = c.createDelay(); dl.delayTime.value = .3; const fb = c.createGain(); fb.gain.value = .28; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2000;
    this.mus.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(this.master);
  },
  setMute(m) { save.muted = m; persist(); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .8, this.ctx.currentTime, .05); },
  tone(f, t, dur, o = {}) {
    const c = this.ctx; if (!c) return;
    const osc = c.createOscillator(); osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const gn = c.createGain(); gn.gain.setValueAtTime(.0001, t); gn.gain.linearRampToValueAtTime(o.vol || .2, t + (o.attack || .006)); gn.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = osc; if (o.filter) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.filter; osc.connect(fl); node = fl; }
    node.connect(gn); gn.connect(o.dest || this.fx); osc.start(t); osc.stop(t + dur + .05);
  },
  hiss(t, dur, vol = .15, hp = 6000, dest) {
    const c = this.ctx; if (!c) return;

function buildLevel(L, idx) {
  const R = rng(9001 + idx * 131);
  const plan = ['S', 'r', 'r', 'CK', 'r', 'r', 'CK'];
  if (L.power) plan.push('PW');
  if (L.power === 'lens') plan.push('H');
  plan.push('r', 'DR', 'CK', 'r', 'r', 'CK', 'r', 'r', 'CK', 'X');
  const chunks = []; let last = '';
  plan.forEach((p) => {
    if (p === 'r') { let k; do { k = L.pool[Math.floor(R() * L.pool.length)]; } while (k === last && L.pool.length > 1); last = k; chunks.push({ k, reg: true }); }
    else chunks.push({ k: p, reg: false });
  });
  const cols = chunks.reduce((a, c) => a + CH[c.k][0].length, 0) + 2;
  const grid = Array.from({ length: ROWS }, () => Array(cols).fill('.'));
  let ox = 0;
  chunks.forEach((c) => { c.ox = ox; CH[c.k].forEach((line, li) => { for (let x = 0; x < line.length; x++) grid[5 + li][ox + x] = line[x]; }); ox += CH[c.k][0].length; });
  for (let r = 0; r < ROWS; r++) { grid[r][cols - 1] = '#'; grid[r][cols - 2] = '#'; }
  // lesson jewels spread over regular chunks
  const regs = chunks.filter((c) => c.reg), n = L.lessons.length;
  for (let k = 0; k < n; k++) {
    const c = regs[Math.min(regs.length - 1, Math.floor((k + .5) * regs.length / n))];
    let placed = false;
    for (const dx of [7, 8, 6, 9, 5, 10, 4, 11, 3, 12]) {
      const x = c.ox + dx;
      if (grid[13][x] === '#' && [8, 9, 10, 11, 12].every((r) => grid[r][x] === '.')) { grid[10][x] = 'J' + k; placed = true; break; }
    }
    if (!placed) grid[7][c.ox + 8] = 'J' + k;
  }
  const ents = []; let jewels = 0;
  for (let r = 0; r < ROWS; r++) for (let x = 0; x < cols; x++) {
    const ch = grid[r][x]; if ('#-h.'.includes(ch)) continue;
    const X0 = x * TS, Y0 = r * TS, BOT = (r + 1) * TS;
    if (ch === 'o') ents.push({ type: 'coin', x: X0 + 24, y: Y0 + 24, r: 12 });
    else if (ch === 'w') ents.push({ type: 'walker', x: X0 + 6, y: BOT - 38, w: 38, h: 38, vx: -55, alive: true, t: R() * 9, info: L.walker });
    else if (ch === 'f') ents.push({ type: 'flyer', x0: X0 + 24, y0: Y0 + 24, x: X0 + 6, y: Y0 + 6, w: 38, h: 34, alive: true, t: R() * 9, info: L.flyer });
    else if (ch === 's') ents.push({ type: 'spring', x: X0 + 6, y: BOT - 20, w: 36, h: 20, k: 0 });
    else if (ch === 'm') ents.push({ type: 'mover', x0: X0, x: X0, y: Y0 + 10, w: 110, h: 18, t: 0, dx: 0, amp: 2.4 * TS });
    else if (ch === '^') ents.push({ type: 'spike', x: X0 + 2, y: BOT - 20, w: TS - 4, h: 20 });
    else if (ch === 'C') ents.push({ type: 'check', x: X0 + 12, y: BOT - 84, w: 26, h: 84, on: false });
    else if (ch === 'D') ents.push({ type: 'door', x: X0 - 10, y: BOT - 104, w: 68, h: 104, done: false });
    else if (ch === 'P') ents.push({ type: 'power', x: X0 + 24, y: Y0 + 24, r: 18, kind: L.power });
    else if (ch === 'B') ents.push({ type: 'gate', x: X0 - 30, y: BOT - 200, w: 108, h: 200, done: false });
    else if (ch[0] === 'J') { ents.push({ type: 'jewel', x: X0 + 24, y: Y0 + 24, r: 20, lesson: +ch.slice(1) }); jewels++; }
    grid[r][x] = '.';
  }
  return { grid, cols, ents, jewels, spawn: { x: 2 * TS + 11, y: 13 * TS - 46 } };
}

function updateParticles(dt) {

  floats = floats.filter((f) => f.life > 0);
}

    const highs = U.filter((u, i) => u[1] === 'H' && sel.has(i)).length, lows = U.filter((u, i) => u[1] === 'L' && sel.has(i)).length;
    const pct = clamp(highs / 4 - lows * .1, 0, 1); const left = U.filter((u, i) => u[1] === 'H' && !sel.has(i)).map((u) => u[0]);
    AU.sfx(pct >= .75 ? 'win' : 'wrong'); host.querySelectorAll('.unit').forEach((b) => b.disabled = true); $('#plGo').disabled = true;
    const fb = $('#plFb'); fb.style.display = 'block';
    fb.innerHTML = `<b>${highs}/4 high-risk areas covered.</b> ${left.length ? `You must tell the board why ${left.join(', ')} ${left.length > 1 ? 'are' : 'is'} not in the plan. ` : 'All high-risk areas are covered. '}The Standards also say to consider IT governance, fraud risk, and compliance and ethics programmes, and the board approves the plan (9.4). <div style="margin-top:8px"><button class="btn primary small" id="plDone">Finish</button></div>`;
    $('#plDone').onclick = () => done(pct, `Plan approved with ${highs} of 4 high-risk areas.`);
  };
}
function miniGap(host, done) {
  const R = [
    ['All supplier bank-detail changes are independently verified.', '9 of 40 changes tested were paid without verification.', 0, 'A finding. Likely root cause: nobody owns the control in the new system. Ask “why?” until you reach it.'],
    ['Access reviews are performed every quarter.', 'All four quarterly reviews were completed and signed off.', 1, 'No gap: provide assurance, and acknowledge when processes are effective (14.5).'],
    ['Expense claims over £500 need director approval.', '3 claims over £500 were approved only by the claimant’s peer.', 0, 'A finding. The effect: unauthorised spend. Rate its significance by likelihood and impact.'],
    ['Data backups are restore-tested monthly.', 'Restore tests passed for all 12 months, evidenced in system logs.', 1, 'No gap, and the evidence is reliable because it comes from a well-controlled system. Provide assurance.'],
    ['Contracts above £100k are competitively tendered.', 'Two £150k contracts were single-sourced without a waiver.', 0, 'A finding. Recommend an action plan with an owner and a date (15.1).']
  ];
  quizRounds(host, R.map((r) => ({ html: `<div class="cc"><div class="cr"><b>Criteria · what should be</b>${r[0]}</div><div class="cd"><b>Condition · what is</b>${r[1]}</div></div>`, a: r[2], why: r[3] })), ['Finding (a gap)', 'No finding: assurance'], done, (s) => `${s} of 5 judged correctly. Mind the gap!`);
}
function miniCodeOr(host, done) {
  const R = [
    ['External quality assessment at least every five years.', 2, 'Both: GIAS Standard 8.4 and Code Principle 34.'],
    ['At least one external assessor must hold an active CIA.', 1, 'GIAS Standard 8.4.'],
    ['Twelve named scope areas, including culture and AI.', 0, 'Code Principle 8.'],
    ['The CAE normally sits at executive-committee level.', 0, 'Code Principle 15.'],
    ['Engagement risk assessments must consider fraud.', 1, 'GIAS Standard 13.2.'],
    ['An annual independence discussion once the CAE’s tenure passes seven years.', 0, 'Code Principle 21.'],
    ['Integrity, objectivity, competency, due care and confidentiality.', 1, 'GIAS Domain II, Principles 1–5.'],
    ['The audit committee’s annual report concludes on internal audit’s effectiveness.', 0, 'Code Principle 4.']
  ];
  quizRounds(host, R.map((r) => ({ q: r[0], a: r[1], why: r[2] })), ['UK Code', 'Global Standards', 'Both'], done, (s) => `${s} of 8 sorted correctly.`);
}
function miniMemory(host, done) {
  const P2 = [['Finding', 'Gap between criteria and condition'], ['Assurance', 'Confidence, measured against criteria'], ['Objectivity', 'An unbiased mental attitude'], ['Root cause', 'The underlying reason for the gap'], ['Risk appetite', 'Risk the organisation will accept'], ['Charter', 'Formal document holding the mandate']];
  const cards = []; P2.forEach((p, i) => { cards.push({ i, txt: p[0], term: 1 }); cards.push({ i, txt: p[1] }); });
  for (let k = cards.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [cards[k], cards[j]] = [cards[j], cards[k]]; }
  host.innerHTML = `<p class="prog" id="mmInfo">Flips 0 · Pairs 0/6</p><div class="mem">${cards.map((c, k) => `<button class="mcard" data-k="${k}" aria-label="Card ${k + 1}"><div class="in"><div class="f">✦</div><div class="b">${c.term ? '<b style="font:700 18px var(--serif)">' + c.txt + '</b>' : c.txt}</div></div></button>`).join('')}</div>`;
  let open = [], flips = 0, pairs = 0, lock = false;
  host.querySelectorAll('.mcard').forEach((b) => b.onclick = () => {
    const k = +b.dataset.k; if (lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up'); open.push(k); AU.sfx('click');
    if (open.length === 2) { flips++; lock = true; const [a, c] = open, A = cards[a], C = cards[c], ba = host.querySelector(`[data-k="${a}"]`), bc = host.querySelector(`[data-k="${c}"]`);
      if (A.i === C.i && A.term !== C.term) { setTimeout(() => { ba.classList.add('done'); bc.classList.add('done'); AU.sfx('right'); pairs++; open = []; lock = false; $('#mmInfo').textContent = `Flips ${flips} · Pairs ${pairs}/6`; if (pairs === 6) setTimeout(() => done(clamp(1 - (flips - 6) / 14, .3, 1), `All pairs matched in ${flips} flips.`), 600); }, 350); }
      else setTimeout(() => { ba.classList.remove('up'); bc.classList.remove('up'); open = []; lock = false; $('#mmInfo').textContent = `Flips ${flips} · Pairs ${pairs}/6`; }, 900);
    }
  });
}

/* ============================== BOSS ============================== */
function bossSVG(B) {
  const c = B.color, d = shade(c, .7), l = shade(c, 1.3);
  const acc = {
    fog: `<g opacity=".7" fill="#dfe6ec"><ellipse cx="40" cy="180" rx="50" ry="18"/><ellipse cx="200" cy="170" rx="50" ry="16"/><ellipse cx="120" cy="205" rx="80" ry="14"/></g>`,
    tie: `<path d="M110 150 L130 150 L136 196 L120 212 L104 196 Z" fill="#d8b25a"/><path d="M70 58 Q120 20 170 58 Q150 44 120 46 Q92 46 70 58Z" fill="#1f1b16"/>`,
    scissors: `<g transform="translate(190,70) rotate(20)"><circle cx="0" cy="40" r="12" fill="none" stroke="#c9ced6" stroke-width="6"/><circle cx="26" cy="40" r="12" fill="none" stroke="#c9ced6" stroke-width="6"/><path d="M6 30 L30 -30 M20 30 L-4 -30" stroke="#c9ced6" stroke-width="7" stroke-linecap="round"/></g>`,
    hydra: `<g fill="${c}"><path d="M40 120 Q10 60 30 40 Q50 30 56 60 Q58 90 70 120Z"/><path d="M200 120 Q230 60 210 40 Q190 30 184 60 Q182 90 170 120Z"/></g><g fill="#fff"><circle cx="34" cy="46" r="6"/><circle cx="206" cy="46" r="6"/></g><g fill="#1f1b16"><circle cx="35" cy="47" r="3"/><circle cx="205" cy="47" r="3"/></g>`,
    golem: `<path d="M80 80 L100 110 L90 140 M160 90 L140 120 L150 150 M110 170 L130 150" stroke="${d}" stroke-width="4" fill="none"/>`,

    assessor: `<path d="M60 70 Q120 10 180 70 Q170 40 120 34 Q70 40 60 70Z" fill="#f5efe2"/><g transform="translate(190,120) rotate(-30)"><rect x="-6" y="0" width="12" height="60" fill="#6b4424"/><rect x="-22" y="-14" width="44" height="22" rx="4" fill="#8a6516"/></g>`

    <path d="M76 78 L110 88 M164 78 L130 88" stroke="#1f1b16" stroke-width="6" stroke-linecap="round"/>
    <path d="M90 132 Q120 150 150 132 Q120 140 90 132Z" fill="#1f1b16"/><path d="M100 134 l5 7 l5 -6 M130 134 l5 7 l5 -6" fill="#fff"/>
    ${B.acc !== 'hydra' ? acc : ''}
  </svg>`;
}
function openBoss() {
  state = 'overlay'; MUS.play('boss'); AU.sfx('hit'); shake = 10;
  const B = lvl.L.boss; let qi = 0, hp = B.qs.length, misses = 0;
  const render = () => {
    const q = B.qs[qi];
    overlay(`<div class="panel boss-panel"><div>${bossSVG(B)}</div><div>
      <div class="kicker">Boss battle · ${lvl.L.title}</div><h2>${B.name}</h2>
      <div class="hp" aria-label="Boss health ${hp} of ${B.qs.length}">${B.qs.map((_, k) => `<i class="${k < hp ? '' : 'gone'}"></i>`).join('')}</div>
      <div class="taunt" id="bTaunt">“${B.taunt}”</div>
      <div class="scen" style="font-size:21px">${q.q}</div>
      ${q.o.map((o, k) => `<button class="choice" data-k="${k}"><b>${k + 1}.</b> ${o}</button>`).join('')}
      <div class="fb" id="bFb" style="display:none"></div></div></div>`);
    VOICE.say(q.q);
    let locked = false;
    const pick = (k) => {
      if (locked) return; const btn = OV.querySelector(`.choice[data-k="${k}"]`); if (!btn || btn.disabled) return;
      if (k === q.a) {
        locked = true; btn.classList.add('right'); AU.sfx('hit'); shake = 8; hp--; lvl.score += 200;
        const sv = $('#bossSvg'); sv.classList.remove('hit'); void sv.getBoundingClientRect(); sv.classList.add(hp <= 0 ? 'dead' : 'hit');
        OV.querySelectorAll('.hp i')[hp].classList.add('gone');
        $('#bTaunt').textContent = hp <= 0 ? '“Nooo! The evidence is… sufficient!”' : ['“Ouch! A well-supported point…”', '“Argh! You’ve read the Standards!”', '“Hmph, lucky guess!”'][qi % 3];
        const fb = $('#bFb'); fb.style.display = 'block'; fb.innerHTML = `<b>✓ Direct hit! +200.</b> ${q.why}`;
        setTimeout(() => { qi++; if (hp <= 0) bossDefeated(misses); else render(); }, hp <= 0 ? 1500 : 1300);
      } else {
        misses++; btn.classList.add('wrong'); btn.disabled = true; AU.sfx('wrong'); $('#bTaunt').textContent = '“Ha! Wrong! Try again, rookie.”';
        const fb = $('#bFb'); fb.style.display = 'block'; fb.innerHTML = `<b>Ada’s hint:</b> ${q.why.split(':')[0].includes('Standard') || q.why.includes('Code') ? 'Think about ' + q.why.split(':')[0] + '.' : 'Look again. The jewels you collected in this level hold the answer.'}`;
      }
    };
    OV.querySelectorAll('.choice').forEach((b) => b.onclick = () => pick(+b.dataset.k));
    ovKey = (e) => { const n = +e.key; if (n >= 1 && n <= q.o.length) pick(n - 1); };
  };
  card({ kicker: 'A boss blocks the way!', title: B.name, body: `“${B.taunt}” Answer ${B.qs.length} questions correctly to defeat it. A wrong answer doesn’t cost you a life, and Ada will give you a hint.`, btn: 'Fight with knowledge!', gem: false }, render);
}
function bossDefeated(misses) {
  lvl.bossMiss = misses; AU.sfx('win'); confetti();
  const L = lvl.L, i = lvl.i, allJ = lvl.jewels === lvl.jewelsTotal, good = lvl.miniPct >= .7 && misses <= 1;
  const stars = 1 + (allJ ? 1 : 0) + (good ? 1 : 0);
  lvl.score += Math.max(0, 300 - lvl.setbacks * 30);
  const prev = save.stats[i] || {};
  save.stats[i] = { stars: Math.max(stars, prev.stars || 0), score: Math.max(lvl.score, prev.score || 0) };
  save.unlocked = Math.max(save.unlocked, Math.min(7, i + 2)); save.best = Object.values(save.stats).reduce((a, s) => a + s.score, 0); persist();
  MUS.play('menu'); VOICE.say(`Brilliant! You defeated ${L.boss.name}. You've earned the badge: ${L.badge}.`);
  const last = i === LEVELS.length - 1;
  overlay(`<div class="panel" style="text-align:center;width:min(640px,100%)">
    <div class="kicker">Level ${i + 1} complete</div><h2>${L.boss.name} is defeated!</h2>
    <div class="stars">${[0, 1, 2].map((k) => starSVG(k < stars, 62).replace('<svg', `<svg class="${k < stars ? 'on' : ''}"`)).join('')}</div>
    <div class="badge" style="margin:6px auto"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="url(#bg${i})"/><defs><linearGradient id="bg${i}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#8a6516"/><stop offset=".5" stop-color="#f3dc98"/><stop offset="1" stop-color="#8a6516"/></linearGradient></defs><text x="20" y="26" text-anchor="middle" font-family="Cormorant Garamond" font-size="18" font-weight="700" fill="#2a1f0b">${i + 1}</text></svg>Badge earned: ${L.badge}</div>
    <div class="statgrid"><div class="stat"><b>${lvl.jewels}/${lvl.jewelsTotal}</b><span>Jewels</span></div><div class="stat"><b>${lvl.score}</b><span>Score</span></div><div class="stat"><b>${Math.round(lvl.miniPct * 100)}%</b><span>Challenge</span></div><div class="stat"><b>${misses}</b><span>Boss misses</span></div><div class="stat"><b>${lvl.setbacks}</b><span>Setbacks</span></div></div>
    <p style="font-size:13.5px">★ Complete the level · ★ Collect every jewel · ★ Score 70%+ in the challenge with at most one boss miss</p>
    <div class="row" style="justify-content:center">${allJ ? '' : '<button class="btn" id="cRetry">Replay for all jewels</button>'}<button class="btn" id="cMap">World map</button><button class="btn primary" id="cNext">${last ? 'Claim your certificate' : 'Next level'}<kbd>Enter</kbd></button></div></div>`);
  const next = () => { if (last) showCertificate(); else { closeOverlay(); startLevel(i + 1); } };
  $('#cNext').onclick = next; $('#cMap').onclick = () => showMap(); if ($('#cRetry')) $('#cRetry').onclick = () => { closeOverlay(); startLevel(i); };
  ovKey = (e) => { if (e.key === 'Enter' && ready()) next(); };
  $('#hud').classList.add('hidden');
}
function showCertificate() {
  state = 'map'; $('#hud').classList.add('hidden'); AU.sfx('win'); confetti();
  const d = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
  overlay(`<div class="panel cert"><div class="kicker">Certificate of completion</div><h1>Assurance <span class="gold-text">Quest</span></h1>
    <p style="font-size:18px;margin:4px 0">This certifies that</p><div class="who">${esc(save.hero.name)}</div>
    <p style="font-size:18px">has journeyed through all seven lands of the Global Internal Audit Standards and the UK Code of Practice,<br>collected <b>${save.codex.length} of 39</b> lesson jewels, earned <b>${totalStars()} of 21</b> stars, and defeated every boss with knowledge.</p>
    <div class="row" style="justify-content:center;gap:24px;margin:14px 0 6px">${LEVELS.map((L, i) => `<span title="${L.badge}" style="font:600 12px var(--sans);color:var(--gold3)">★ ${L.badge}</span>`).join('')}</div>
    <p style="font-family:var(--serif);font-style:italic;font-size:20px">“Internal auditing strengthens the organisation’s ability to create, protect, and sustain value.”</p>
    <p style="font-size:13px">Awarded ${d} · Mentor: Ada the Assurance Owl</p>
    <div class="row" style="justify-content:center"><button class="btn" onclick="window.print()">🖨 Print certificate</button><button class="btn primary" id="ctMap">World map</button></div></div>`);
  $('#ctMap').onclick = () => showMap(); VOICE.say(`Congratulations ${save.hero.name}! You have completed the Assurance Quest.`);
}

/* ------------------------------ confetti ------------------------------ */
function confetti() {
  const c = $('#confetti'), x = c.getContext('2d'), P2 = [];
  for (let i = 0; i < 160; i++) P2.push({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 120, vy: 120 + Math.random() * 200, r: Math.random() * 6, c: ['#d8b25a', '#8a3b52', '#2f5d8a', '#3e7a5c', '#a4552f', '#f3dc98'][i % 6], s: Math.random() * 6 });
  let last = performance.now(), t = 0;
  const loop = (now) => { const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt; x.clearRect(0, 0, c.width, c.height);
    P2.forEach((p) => { p.x += p.vx * dt; p.y += p.vy * dt; p.s += dt * 6; x.save(); x.translate(p.x, p.y); x.rotate(p.s); x.fillStyle = p.c; x.fillRect(-4, -2, 8 + p.r, 4); x.restore(); });
    if (t < 4) requestAnimationFrame(loop); else x.clearRect(0, 0, c.width, c.height); };
  requestAnimationFrame(loop);
}

/* ============================== INPUT ============================== */
const JUMPK = [' ', 'ArrowUp', 'w', 'W', 'z', 'Z'];
addEventListener('keydown', (e) => {
  if (ovKey && OV.classList.contains('on')) { ovKey(e); return; }
  if (state !== 'play') return;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') IN.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') IN.right = true;
  if (JUMPK.includes(e.key)) { if (!IN.jump) P.jumpBuf = .14; IN.jump = true; }
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') pause();
  if (e.key === 'm' || e.key === 'M') $('#bMusic').click();
  if (e.key === 'v' || e.key === 'V') $('#bVoice').click();
});
addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') IN.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') IN.right = false;
  if (JUMPK.includes(e.key)) IN.jump = false;
});
addEventListener('blur', () => { IN.left = IN.right = IN.jump = false; if (state === 'play') pause(); });
$('#bMusic').onclick = () => { AU.init(); AU.setMute(!save.muted); updateHUD(true); };
$('#bVoice').onclick = () => { save.voice = !save.voice; persist(); if (!save.voice) VOICE.stop(); updateHUD(true); toast(save.voice ? 'Mentor voice on' : 'Mentor voice off'); };
$('#bPause').onclick = pause;
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
function setTouch(on) { $('#touch').classList.toggle('on', on && isTouch); }
$('#touch').querySelectorAll('button').forEach((b) => {
  const k = b.dataset.k;
  const down = (e) => { e.preventDefault(); AU.init(); if (k === 'jump') { if (!IN.jump && P) P.jumpBuf = .14; IN.jump = true; } else IN[k] = true; };
  const up = (e) => { e.preventDefault(); if (k === 'jump') IN.jump = false; else IN[k] = false; };
  b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

/* ============================== LOOP ============================== */
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt;
  const STEP = 1 / 120; let n = 0;
  while (acc >= STEP && n < 12) { update(STEP); acc -= STEP; n++; }
  if (state === 'play') setTouch(true);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
showTitle();

// test hooks (harmless in normal play)
window.__AQ = { get state() { return state; }, get lvl() { return lvl; }, get P() { return P; }, startLevel, showMap, showCertificate, openBoss, openMini, get save() { return save; }, LEVELS };
})();
</script>
