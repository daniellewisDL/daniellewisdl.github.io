<style>
html,body{margin:0;height:100%;background:#12061c;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

#touch.show{display:block}
.tb{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.13);border:3px solid rgba(255,255,255,.38);color:rgba(255,255,255,.92);font:bold 14px/1 monospace;display:flex;align-items:center;justify-content:center;touch-action:none;box-sizing:border-box;letter-spacing:1px}
.tb.on{background:rgba(236,28,124,.5);border-color:#ff8cc0}
#bl{left:max(14px,env(safe-area-inset-left));bottom:16px;width:76px;height:76px;font-size:26px}
#br{left:calc(max(14px,env(safe-area-inset-left)) + 88px);bottom:16px;width:76px;height:76px;font-size:26px}
#bk{right:calc(max(14px,env(safe-area-inset-right)) + 92px);bottom:16px;width:72px;height:72px}
#bj{right:max(14px,env(safe-area-inset-right));bottom:46px;width:82px;height:82px}
#bp{right:max(10px,env(safe-area-inset-right));top:8px;width:44px;height:44px;border-radius:10px}

#rot{position:fixed;inset:0;background:#2a0a3a;color:#fff;font:bold 20px monospace;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;z-index:9}

// =====================================================================
//  INPUT
// =====================================================================
const held={},pressed={};
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
 Space:'jump',KeyZ:'jump',KeyX:'kick',KeyJ:'kick',KeyK:'kick',ShiftLeft:'kick',ShiftRight:'kick',Enter:'start',Escape:'pause',KeyP:'pause',KeyM:'mute'};
function press(k){ if(!held[k]) pressed[k]=true; held[k]=true; }
function release(k){ held[k]=false; }
addEventListener('keydown',e=>{const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); initAudio(); if(!e.repeat) press(k);});
addEventListener('keyup',e=>{const k=KEYMAP[e.code]; if(k) release(k);});
let isTouch=false;
function showTouch(){ if(isTouch) return; isTouch=true; document.getElementById('touch').classList.add('show'); document.body.classList.add('touch'); }
if(matchMedia('(pointer:coarse)').matches) showTouch();
document.querySelectorAll('.tb').forEach(b=>{
  const k=b.dataset.k; const ids=new Set();
  b.addEventListener('pointerdown',e=>{e.preventDefault(); initAudio(); ids.add(e.pointerId); try{b.setPointerCapture(e.pointerId);}catch(_){} press(k); b.classList.add('on');});
  const up=e=>{ids.delete(e.pointerId); if(!ids.size){release(k); b.classList.remove('on');}};
  b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up); b.addEventListener('lostpointercapture',up);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
cv.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') showTouch(); initAudio(); press('tap'); });
cv.addEventListener('pointerup',()=>release('tap'));
addEventListener('touchstart',()=>showTouch(),{passive:true});
const confirmP=()=>pressed.start||pressed.jump||pressed.kick||pressed.tap;

// =====================================================================
//  AUDIO  (all synthesised)
// =====================================================================
let AC=null,master,musicGain,sfxGain,noiseBuf,muted=!!store.muted,pendingSong=null;
function initAudio(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; return; }
  master=AC.createGain(); master.gain.value=muted?0:0.55; master.connect(AC.destination);
  musicGain=AC.createGain(); musicGain.gain.value=0.33; musicGain.connect(master);
  sfxGain=AC.createGain(); sfxGain.gain.value=0.6; sfxGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  if(pendingSong){ const p=pendingSong; pendingSong=null; playSong(p[0],p[1]); }
}
function toggleMute(){ muted=!muted; store.muted=muted; saveStore(); if(master) master.gain.value=muted?0:0.55; }
function tone(f,dur,type='square',vol=0.25,slide=0,when=0,dest){
  if(!AC) return; dest=dest||sfxGain; const t=AC.currentTime+when; const o=AC.createOscillator(),g=AC.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.03);
}
function noise(dur,vol=0.3,when=0,freq=3000,type='bandpass',dest,attack=0.003){
  if(!AC) return; dest=dest||sfxGain; const t=AC.currentTime+when; const s=AC.createBufferSource(); s.buffer=noiseBuf;
  const f=AC.createBiquadFilter(); f.type=type; f.frequency.value=freq; const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+attack); g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t,Math.random()*0.5); s.stop(t+dur+0.05);
}

  jump(){tone(260,0.16,'square',0.14,420);},
  coin(){tone(988,0.06,'square',0.13);tone(1319,0.14,'square',0.13,0,0.06);},
  kit(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.12,'square',0.13,0,i*0.06));},
  stomp(){tone(220,0.12,'square',0.2,-160);noise(0.08,0.25,0,1200);},
  kick(){noise(0.05,0.4,0,900);tone(140,0.09,'triangle',0.45,-80);},
  hurt(){tone(420,0.35,'sawtooth',0.18,-320);},
  bump(){tone(110,0.08,'square',0.2,-30);},
  spring(){tone(200,0.3,'square',0.15,700);},
  check(){[392,523,659,784].forEach((f,i)=>tone(f,0.1,'square',0.12,0,i*0.07));},
  oneup(){[659,784,1319,1047,1175,1568].forEach((f,i)=>tone(f,0.09,'square',0.12,0,i*0.07));},

  drawGoal(inNet?so.ripple:null);
  // keeper
  const tekShoot=so.phase==='aimX'||so.phase==='aimY'||so.phase==='run'||so.phase==='flight'||(so.phase==='result'&&so.tek.length>so.opp.length);
  const kspr=tekShoot?OPP_KEEPER:TEK_KEEPER;
  let kx=160+Math.sin(frame*0.08)*4,ky=128,ang=0;
  if(so.kp.dive){ const p=so.kp.dt/14; kx=lerp(160,ZX[so.kp.dive],p); if(so.kp.dive==='C'){ ky=128-Math.sin(p*Math.PI)*8; } else { ang=(so.kp.dive==='L'?-1:1)*p*1.25; ky=128-Math.sin(p*Math.PI)*10+p*6; } }
  ctx.save(); ctx.translate(Math.round(kx),Math.round(ky-16)); ctx.rotate(ang); ctx.drawImage(kspr.r,-13,-17,kspr.r.width*2,kspr.r.height*2); ctx.restore();
  if(ball&&!inNet) drawS(BALL,ball.x-4*ball.s,ball.y-4*ball.s,false,Math.max(1,Math.round(ball.s)));
  if(!ball) drawS(BALL,156,148);
  // kicker
  const opp=so.phase==='oppRun'||so.phase==='oflight'||(so.phase==='result'&&so.tek.length===so.opp.length&&so.opp.length>0);
  let kkx=126,kky=146; if(so.phase==='run'||so.phase==='oppRun'){ const lim=so.phase==='run'?26:50; const p=Math.min(1,so.t/lim); const st=so.phase==='oppRun'?Math.max(0,(so.t-20)/30):p; kkx=lerp(118,140,Math.min(1,st)); kky=lerp(150,140,Math.min(1,st)); } else if(so.phase==='flight'||so.phase==='oflight'||so.phase==='result'){ kkx=142; kky=140; }
  if(so.phase!=='won'&&so.phase!=='intro'){ const ks=opp?(so.opp.length%2?OPP_BACK2:OPP_BACK):(so.shooter||KIDS[0]).back; drawS(ks,kkx-12,kky-4+((so.phase==='run'||so.phase==='oppRun')&&(frame>>2)%2?-1:0),false,2); }
  // Baz on the touchline
  drawS((so.cheer>0&&(frame>>3)%2)?BAZ.cheer:BAZ.idle,6,150);
  // aim UI
  if(so.phase==='aimX'){ const x=Math.round(so.ax); R(ctx,x,80,1,48,'#ffd23a'); R(ctx,x-3,74,7,2,'#ffd23a'); R(ctx,x-2,76,5,1,'#ffd23a'); R(ctx,x-1,77,3,1,'#ffd23a');
    box2('TEKKERZ #'+so.num+' TO SHOOT',isTouch?'TAP KICK TO AIM LEFT / RIGHT':'PRESS X OR SPACE TO AIM'); }
  if(so.phase==='aimY'){ const x=Math.round(so.lx),y=Math.round(so.ay); R(ctx,x-5,y,11,1,'#ffd23a'); R(ctx,x,y-5,1,11,'#ffd23a'); R(ctx,x-3,y-3,7,7,'rgba(255,210,58,.25)');
    box2('NOW PICK THE HEIGHT!',"PRESS AGAIN TO SHOOT - NOT TOO HIGH!"); }
  if(so.phase==='oppRun'||so.phase==='oflight'){ box2('DRAGONS #'+NUMS[(so.opp.length+3)%NUMS.length]+' TO SHOOT',isTouch?'DIVE!  < LEFT   JUMP=MIDDLE   RIGHT >':'DIVE!  < LEFT    ^ MIDDLE    RIGHT >');
    if(so.dive) text(so.dive==='L'?'DIVING LEFT!':so.dive==='R'?'DIVING RIGHT!':'STAYING BIG!',W/2,54,'#6aff5a',1,1); }
  if(so.phase==='intro'){ R(ctx,40,34,240,34,'rgba(26,8,38,.85)'); text('PENALTY SHOOTOUT!',W/2,38,'#ffd23a',2,1); text('TEKKERZ SHOOT FIRST',W/2,56,'#ffffff',1,1); }
  if(so.sd&&so.phase!=='won') text('SUDDEN DEATH',W/2,58,'#ff6a6a',1,1);
  for(const p of parts) R(ctx,p.x,p.y,p.s,p.s,p.c);
  if(so.msg&&(so.phase==='result'||so.phase==='won')){ const s=so.phase==='won'?3:3; const y=36+Math.round(Math.sin(frame*0.2)*2); R(ctx,0,32,W,23,'rgba(26,8,38,.85)'); text(so.msg,W/2,y,so.msgC,s,1,'#1a0826'); }
  if(so.phase==='lost'){ R(ctx,0,40,W,50,'rgba(26,8,38,.85)'); text('SO CLOSE!',W/2,48,'#ff6a6a',3,1); text('PRESS TO TAKE THE SHOOTOUT AGAIN',W/2,72,'#fff',1,1); }
  if(bubble) drawBubble(bubble.text,14,146);
}
function box2(a,b){ R(ctx,40,24,240,26,'rgba(26,8,38,.88)'); R(ctx,40,49,240,1,'#ec1c7c'); text(a,W/2,28,'#ff8cc0',1,1); text(b,W/2,39,'#ffffff',1,1); }

// ---- victory ----
function updWin(){ frame++; if(stT===1){ playSong('win'); store.level=NUM_LEVELS; saveStore(); } if(stT%22===0) firework(); if(stT%2===0) confetti(); for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; } parts=parts.filter(p=>p.life>0);
  if(stT===30) say("CHAMPIONS! I'M SO PROUD OF YOU LOT!",300,true); if(bubble&&--bubble.t<=0) bubble=null;
  if(stT>240&&confirmP()){ credY=H; setState('credits'); } }
function renderWin(){ drawStadium(false); drawGoal(null);
  for(let i=0;i<6;i++){ const j=Math.abs(Math.sin(frame*0.13+i*1.3))*12; const X=i<3?40+i*36:176+(i-3)*36+30; drawS(KIDS[i].up,X,112-j,false,2); }
  const bj=Math.abs(Math.sin(frame*0.1))*4; drawS(BAZ.cheer,W/2-16,96-bj,false,2); drawS(TROPHY,W/2-12,66-bj+Math.sin(frame*0.2),false,2);
  for(const p of parts) R(ctx,p.x,p.y,p.s,p.s,p.c);
  R(ctx,20,4,280,40,'rgba(26,8,38,.8)'); text('CUP WINNERS!',W/2,8+Math.round(Math.sin(frame*0.15)*2),'#ffd23a',4,1,'#6b1f9e');
  text('TEKKERZ '+sc(so.tek)+' - '+sc(so.opp)+' KOWLOON DRAGONS (PENS)',W/2,34,'#ffffff',1,1);
  if(bubble) drawBubble(bubble.text,W/2+64,104);
  if(stT>240&&frame%40<26) text(isTouch?'TAP TO CONTINUE':'PRESS SPACE',W/2,170,'#ff8cc0',1,1);
}
// ---- credits ----
let credY=H;
function updCredits(){ frame++; credY-=0.45; if(stT%40===0) confetti(); for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.life--; } parts=parts.filter(p=>p.life>0);
  if((stT>60&&confirmP())||credY<-420){ setState('title'); } }
function renderCredits(){ R(ctx,0,0,W,H,'#1a0826'); for(const p of parts) R(ctx,p.x,p.y,p.s,p.s,p.c);
  const kitTot=game.kits.reduce((a,b)=>a+b,0);
  const L=[['TEKKERZ','#ec1c7c',4],["BAZ'S CUP QUEST",'#fff',2],['',0,1],['STARRING','#ffd23a',1],['COACH BAZ','#fff',2],['',0,1],['AND THE TEKKERZ KIDS','#ff8cc0',1],['CUP WINNERS!','#ffd23a',1],['',0,1],
    ['FOOTBALLS FOUND: '+game.balls,'#fff',1],['KIT FOUND: '+kitTot+' / 21','#fff',1],['',0,1],['THE JOURNEY','#ffd23a',1],...LEVELS.map(l=>[l.name,'#d8c8e8',1]),['HONG KONG STADIUM','#d8c8e8',1],['',0,1],
    ['TEKKERZ FOOTBALL CLUB','#ec1c7c',1],['DISCOVERY BAY, HONG KONG','#fff',1],['1000 TOUCHES EVERY SESSION!','#fff',1],['',0,1],['',0,1],['THANKS FOR PLAYING!','#6aff5a',2]];
  let y=credY; for(const [t,c,s] of L){ if(t&&y>-20&&y<H+10) text(t,W/2+20,y,c,s,1); y+=s*6+6; }
  if(portraitOK){ R(ctx,8,58,44,62,'#ec1c7c'); ctx.drawImage(PORTRAIT,10,60); }
  drawS(TROPHY,W-40,70,false,2);
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
function update(){ stT++;
  if(pressed.mute) toggleMute();
  switch(state){ case 'title':updTitle();break; case 'story':updStory();break; case 'intro':updIntro();break; case 'play':updPlay();break; case 'clear':updClear();break;
    case 'pause':updPause();break; case 'gameover':updGameOver();break; case 'shoot':updShoot();break; case 'win':updWin();break; case 'credits':updCredits();break; }
  for(const k in pressed) pressed[k]=false;
}
function render(){ ctx.imageSmoothingEnabled=false;
  switch(state){ case 'title':renderTitle();break; case 'story':renderStory();break; case 'intro':renderIntro();break; case 'play':renderPlay();break; case 'clear':renderClear();break;
    case 'pause':renderPause();break; case 'gameover':renderGameOver();break; case 'shoot':renderShoot();break; case 'win':renderWin();break; case 'credits':renderCredits();break; }
  if(muted&&state!=='play'){ text('MUSIC OFF',W-4,H-8,'#8a7aa0',1,2,null); }
}
let last=performance.now(),accum=0;
function loop(now){ accum+=Math.min(0.1,(now-last)/1000); last=now; let n=0; while(accum>=1/60&&n<5){ update(); accum-=1/60; n++; } render(); requestAnimationFrame(loop); }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ if(state==='play') setState('pause'); if(AC) AC.suspend(); } else if(AC) AC.resume(); });
requestAnimationFrame(loop);
</script>
